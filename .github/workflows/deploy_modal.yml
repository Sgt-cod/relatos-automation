name: Deploy Modal (avatar lipsync)

on:
  workflow_dispatch: {}  # aparece um botão "Run workflow" na aba Actions
  push:
    paths:
      - "modal_avatar.py"  # também roda automaticamente se você editar esse arquivo pelo navegador

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar CLI da Modal
        run: pip install modal

      - name: Autenticar com a Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Publicar a função (modal deploy)
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          modal deploy modal_avatar.py | tee deploy_output.txt

      - name: Se falhou, mostrar o log completo do build da imagem
        if: failure()
        run: |
          IMAGE_ID=$(grep -oE 'im-[a-zA-Z0-9]+' deploy_output.txt | tail -1)
          if [ -n "$IMAGE_ID" ]; then
            echo "Log completo do build da imagem $IMAGE_ID:"
            modal image logs "$IMAGE_ID"
          else
            echo "Não encontrei o ID da imagem no log acima — role o log do passo anterior manualmente."
          fi

      - name: Mostrar a URL do endpoint
        run: |
          echo "----------------------------------------------------"
          echo "Copie a URL abaixo e salve como o Secret MODAL_ENDPOINT_URL:"
          grep -o 'https://[a-zA-Z0-9.-]*\.modal\.run[a-zA-Z0-9/_-]*' deploy_output.txt || echo "URL não encontrada no log — role o log completo acima manualmente."
          echo "----------------------------------------------------"
