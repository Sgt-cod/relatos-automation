name: Gerar vídeo

on:
  schedule:
    # Ajuste os horários depois de decidir a frequência.
    # Exemplo: roda às 9h e às 15h (horário UTC — ajuste para BRT, UTC-3).
    - cron: "0 12,18 * * *"
  workflow_dispatch: {}  # permite disparar manualmente pelo GitHub também

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar Deno (necessário para o yt-dlp resolver desafios de JS do YouTube)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Garantir yt-dlp na versão mais recente
        run: pip install --upgrade yt-dlp
        # A extração do YouTube muda com frequência e o yt-dlp lança
        # correções constantemente — instalar sempre a versão mais nova
        # reduz a chance desse tipo de erro voltar a acontecer.

      - name: 1. Buscar e baixar entrevista
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > cookies.txt
          fi
          python find_and_download.py

      - name: 2. Gerar roteiro com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_script.py

      - name: 3. Gerar áudio com Fish Audio
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          FISH_AUDIO_VOICE_ID: ${{ secrets.FISH_AUDIO_VOICE_ID }}
        run: python generate_audio.py

      - name: 4. Gerar avatar via Modal (GPU externa)
        env:
          MODAL_ENDPOINT_URL: ${{ secrets.MODAL_ENDPOINT_URL }}
        run: python call_modal_endpoint.py

      - name: 5. Compor vídeo final (ffmpeg)
        run: python compose_video.py

      - name: 6. Gerar thumbnail
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: python generate_thumbnail.py

      - name: 7. Enviar para aprovação no Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_approval_request.py

      - name: Salvar arquivos pendentes no repositório
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add pending/
          git commit -m "Vídeo pendente de aprovação: $(date -u +%Y%m%d-%H%M%S)" || echo "Nada para commitar"
          git push
