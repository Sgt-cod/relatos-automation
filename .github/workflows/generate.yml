name: Gerar, aprovar e publicar vídeo

on:
  schedule:
    # Ajuste os horários depois de decidir a frequência.
    # Exemplo: roda às 9h e às 15h (horário UTC — ajuste para BRT, UTC-3).
    - cron: "0 12,18 * * *"
  workflow_dispatch:
    inputs:
      approval_timeout_min:
        description: "Minutos de espera pela aprovação no Telegram antes de cancelar"
        required: false
        default: "60"
      use_modal:
        description: "Usar avatar via Modal (SadTalker)? Se desmarcado, usa o vídeo local do apresentador (assets/presenter.mp4) com o áudio gerado."
        required: false
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # Folga generosa: geração (~15-20min) + espera pela aprovação (até 60min
    # por padrão) + composição/publicação (~5min). Ajuste se mudar o timeout
    # de aprovação abaixo.
    timeout-minutes: 100
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar Deno (necessário para o yt-dlp resolver desafios de JS do YouTube)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Garantir yt-dlp na versão mais recente
        run: pip install --upgrade yt-dlp
        # A extração do YouTube muda com frequência e o yt-dlp lança
        # correções constantemente — instalar sempre a versão mais nova
        # reduz a chance desse tipo de erro voltar a acontecer.

      - name: 1. Buscar e baixar entrevista
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > cookies.txt
          fi
          python find_and_download.py

      - name: 2. Gerar roteiro com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_script.py

      - name: 3. Gerar áudio com Fish Audio
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          FISH_AUDIO_VOICE_ID: ${{ secrets.FISH_AUDIO_VOICE_ID }}
        run: python generate_audio.py

      - name: 4a. Gerar avatar via Modal (GPU externa) — só em disparo manual com use_modal=true
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_modal == true }}
        env:
          MODAL_ENDPOINT_URL: ${{ secrets.MODAL_ENDPOINT_URL }}
        run: python call_modal_endpoint.py

      - name: 4b. Gerar clipe do apresentador (vídeo local + áudio) — padrão em execuções automáticas
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.use_modal == true) }}
        run: python create_presenter_clip.py

      - name: 5. Gerar thumbnail
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_thumbnail.py

      - name: 6. Aprovar no Telegram, compor vídeo final e publicar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          APPROVAL_TIMEOUT_MIN: ${{ github.event.inputs.approval_timeout_min || '60' }}
        run: python approve_compose_publish.py
